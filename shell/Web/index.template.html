<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>{{TITLE}}</title>
    <base href="./" />
    <link rel="icon" type="image/png" href="icon.png" />
    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div id="loading">{{LOADING}}</div>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <!-- KNI's browser bindings; versions match the nkast.Wasm packages KNI 4.3 depends on. -->
    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>

    <script>
        function tickJS() {
            window.theInstance.invokeMethod('TickDotNet');
            window.requestAnimationFrame(tickJS);
        }

        window.initRenderJS = (instance) => {
            window.theInstance = instance;

            const canvas = document.getElementById('theCanvas');
            const holder = document.getElementById('canvasHolder');

            // Keep the canvas the size of the window, also after rotating a phone.
            const fit = () => {
                canvas.width = holder.clientWidth;
                canvas.height = holder.clientHeight;
            };
            fit();
            window.addEventListener('resize', fit);

            canvas.addEventListener('contextmenu', e => e.preventDefault());
            canvas.focus();

            window.requestAnimationFrame(tickJS);
        };

        // Text to the clipboard, for the game: true when the browser has one to write to (it may still refuse).
        window.jentlCopy = (text) => {
            if (!navigator.clipboard) {
                return false;
            }

            navigator.clipboard.writeText(text).catch(() => {});
            return true;
        };

        // A file the game made, handed to the player as a download.
        window.jentlDownload = (name, base64, type) => {
            const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
            const url = URL.createObjectURL(new Blob([bytes], { type }));
            const link = document.createElement('a');
            link.href = url;
            link.download = name;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        };

        // Keep the game's keys from scrolling the page or moving focus:
        // Backspace (undo), Tab (switch pack), Space, arrows.
        window.addEventListener('keydown', event => {
            if ([8, 9, 32, 37, 38, 39, 40].includes(event.keyCode)) {
                event.preventDefault();
            }
        });
    </script>
</body>

</html>
