# Runs the tests, builds every game for the browser and publishes them to GitHub Pages on every push to main:
# a landing page at the root and each game in its own folder (sokoban/, solitaire/, ...).
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a deployment still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the engine version
        run: echo "JENTL_VERSION=$(sed -n 's:.*<JentlVersion>\(.*\)</JentlVersion>.*:\1:p' dependencies.props)" >> "$GITHUB_ENV"

      # The engine is public; building its packages here needs no token for GitHub Packages.
      - uses: actions/checkout@v4
        with:
          repository: coenvk/jentl-cs
          ref: v${{ env.JENTL_VERSION }}
          path: jentl

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack the engine
        run: build/jentl.sh jentl

      - name: Test
        run: dotnet test Games.slnx

      - name: Publish the games
        run: |
          mkdir -p site
          cp build/site/* site/
          publish() {
            dotnet publish "apps/$1/Web" -c Release -o "out/$1" -p:DebugType=None
            mkdir -p "site/$2"
            cp -R "out/$1/wwwroot/." "site/$2/"
          }
          publish Sokoban sokoban
          publish Solitaire solitaire
          publish CardTable card-table
          publish Mossbrook mossbrook
          publish CodeLock code-lock
          publish Bricks bricks

      # Without this, Pages runs Jekyll, which drops the _framework and _content folders.
      - name: Disable Jekyll
        run: touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
